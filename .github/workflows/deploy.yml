name: Deploy to Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: fabled-mystery-474200-i1
      - name: Deploy to Cloud Run
        run: |
          # Deploy with --no-traffic first to avoid version conflict ABORTED error,
          # then explicitly route 100% traffic to the new revision.
          gcloud run deploy steamguard \
            --source . \
            --region us-central1 \
            --set-secrets SECRET_KEY=SECRET_KEY:latest,ADMIN_KEY=ADMIN_KEY:latest,DISCORD_BOT_TOKEN=DISCORD_BOT_TOKEN:latest,DISCORD_GUILD_ID=DISCORD_GUILD_ID:latest,DISCORD_ROLE_ID=DISCORD_ROLE_ID:latest,DISCORD_WEBHOOK_URL=DISCORD_WEBHOOK_URL:latest,MIN_SUPPORTED_VERSION=MIN_SUPPORTED_VERSION:latest,JWT_SECRET=JWT_SECRET:latest,DISCORD_CLIENT_ID=DISCORD_CLIENT_ID:latest,DISCORD_CLIENT_SECRET=DISCORD_CLIENT_SECRET:latest,YOUTUBE_CLIENT_ID=YOUTUBE_CLIENT_ID:latest,YOUTUBE_CLIENT_SECRET=YOUTUBE_CLIENT_SECRET:latest,YOUTUBE_CHANNEL_ID=YOUTUBE_CHANNEL_ID:latest \
            --set-env-vars ADMIN_USER_IDS=1513150836472021074,LICENSE_SERVER_URL=https://rivvak.app,DISCORD_INVITE=https://discord.gg/RTHM8YhpE,OFF_TOPIC_CHANNEL_ID=1513193890117714182,MOD_CHANNEL_ID=1513296463197769770 \
            --no-traffic \
            --quiet
          NEW_REV=$(gcloud run revisions list --service steamguard --region us-central1 --format='value(name)' --sort-by='~createTime' --limit=1)
          gcloud run services update-traffic steamguard --region us-central1 --to-revisions "$NEW_REV=100" --quiet
          echo "Deployed and routed traffic to: $NEW_REV"
  build-windows-client:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard PySide6 pyqtdarktheme
          if (Test-Path "requirements_client.txt") { pip install -r requirements_client.txt }
      - name: Clean PNG Assets
        shell: bash
        run: |
          pip install pillow -q
          python -c "import glob; from PIL import Image; [Image.open(f).save(f) for f in glob.glob('*.png') + glob.glob('assets/*.png')]"
      - name: Build Hardened Binary with Nuitka
        run: |
          python -m nuitka `
            --onefile `
            --windows-console-mode=disable `
            --windows-uac-admin `
            --windows-icon-from-ico=icon.ico `
            --enable-plugin=pyside6 `
            --include-qt-plugins=sensible,styles `
            --include-package-data=qdarktheme `
            --include-data-files=icon.png=icon.png `
            --include-data-files=icon.ico=icon.ico `
            --include-data-files=icon_256.png=icon_256.png `
            --include-data-files=icon_32.png=icon_32.png `
            --include-data-files=icon_64.png=icon_64.png `
            --include-data-files=discord_icon.png=discord_icon.png `
            --assume-yes-for-downloads `
            --company-name="SteamGuard Security" `
            --product-name="SteamGuard" `
            --file-description="SteamGuard Security Client" `
            --file-version="1.0.0.0" `
            --product-version="1.0.0.0" `
            --output-filename=SteamGuard.exe `
            steamguard_qt.py
      - name: Build Loader with Nuitka
        run: |
          pip install PyQt5
          python -m nuitka `
            --onefile `
            --windows-console-mode=disable `
            --windows-uac-admin `
            --windows-icon-from-ico=icon.ico `
            --enable-plugin=pyqt5 `
            --include-package=PyQt5 `
            --assume-yes-for-downloads `
            --company-name="SteamGuard Security" `
            --product-name="SteamGuard Loader" `
            --file-description="SteamGuard Secure Loader" `
            --file-version="1.0.0.0" `
            --product-version="1.0.0.0" `
            --output-filename=Loader.exe `
            loader.py
      - name: Verify Build
        shell: pwsh
        run: |
          if (Test-Path "SteamGuard.exe") { Write-Host "SteamGuard.exe size:" (Get-Item "SteamGuard.exe").Length / 1MB } else { throw "SteamGuard.exe not found!" }
          if (Test-Path "Loader.exe") { Write-Host "Loader.exe size:" (Get-Item "Loader.exe").Length / 1MB } else { throw "Loader.exe not found!" }
      - name: Sign Loader with Self-Signed Certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          # Decode PFX from secret and write to disk
          $pfxBytes = [Convert]::FromBase64String($env:PFX_BASE64)
          $pfxPath = "$env:TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          # Locate signtool (bundled with Windows SDK on GitHub runners)
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using signtool: $signtool"
          # Sign Loader.exe with publisher identity
          & $signtool sign `
            /fd SHA256 `
            /f $pfxPath `
            /p $env:PFX_PASSWORD `
            /d "SteamGuard Secure Loader" `
            /du "https://rivvak.app" `
            /t "http://timestamp.digicert.com" `
            Loader.exe
          Write-Host "Loader.exe signed successfully."
          # Clean up cert
          Remove-Item $pfxPath -Force
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: fabled-mystery-474200-i1
      - name: Upload Binary to GCP Storage
        shell: pwsh
        run: |
          # SteamGuard.exe is PRIVATE - no public IAM, only fetched by server via signed URL
          gcloud storage cp ./SteamGuard.exe gs://steamguard-downloads-fabled/SteamGuard.exe --quiet
          Write-Host "SteamGuard.exe uploaded (private, no public access)."
      - name: Upload Loader to GCP Storage
        shell: pwsh
        run: |
          gcloud storage cp ./Loader.exe gs://steamguard-downloads-fabled/Loader.exe --quiet
          gcloud storage objects add-iam-policy-binding gs://steamguard-downloads-fabled/Loader.exe `
            --member=allUsers `
            --role=roles/storage.legacyObjectReader
      - name: Build Changelog
        id: changelog
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          $commits = git log --oneline --no-merges -5 --pretty=format:"%s"
          $lines = $commits -split "`n"
          $fixes = @()
          $features = @()
          $other = @()
          foreach ($line in $lines) {
            $clean = $line -replace '^(fix|feat|chore|refactor|docs|style|perf|ci|build|test)(\(.+?\))?:\s*', ''
            if ($line -match '^fix') { $fixes += "\uD83D\uDD27 $clean" }
            elseif ($line -match '^feat') { $features += "\u2728 $clean" }
            else { $other += "\u2022 $clean" }
          }
          $changelog = ""
          if ($features.Count -gt 0) { $changelog += "**New Features**`n" + ($features -join "`n") + "`n`n" }
          if ($fixes.Count -gt 0) { $changelog += "**Bug Fixes**`n" + ($fixes -join "`n") + "`n`n" }
          if ($other.Count -gt 0) { $changelog += "**Other Changes**`n" + ($other -join "`n") }
          if ($changelog -eq "") { $changelog = "\u2022 Maintenance update" }
          $changelogJson = $changelog.Trim() -replace '\\', '\\\\' -replace '"', '\\"' -replace "`r`n", '\n' -replace "`n", '\n'
          $versionJson = $version -replace '"', '\\"'
          echo "VERSION=$versionJson" >> $env:GITHUB_OUTPUT
          echo "CHANGELOG=$changelogJson" >> $env:GITHUB_OUTPUT
      - name: Post Embed to Discord
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          $version = '${{ steps.changelog.outputs.VERSION }}'
          $changelog = '${{ steps.changelog.outputs.CHANGELOG }}'
          $buildNum = '${{ github.run_number }}'
          $sha = ('${{ github.sha }}').Substring(0,7)
          $actor = '${{ github.actor }}'
          $ts = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $title = "SteamGuard Client Updated - v$version"
          $description = "Terms of Service and EULA (v1.1) Acceptance Required. This tool is strictly for educational, research, and personal learning purposes."
          $footer = "SteamGuard Security - Build #$buildNum - $sha - pushed by $actor"
          $dlValue = "[Click here to Download](https://rivvak.app/dashboard/SteamGuard.exe)"
          $reqValue = "Member of this server, subscribed to YouTube channel, run as Administrator"
          $body = [ordered]@{
            embeds = @(
              [ordered]@{
                title = $title
                description = $description
                color = 2450411
                fields = @(
                  [ordered]@{ name = "What is New"; value = $changelog; inline = $false }
                  [ordered]@{ name = "Requirements"; value = $reqValue; inline = $false }
                  [ordered]@{ name = "Download"; value = $dlValue; inline = $false }
                )
                footer = [ordered]@{ text = $footer }
                timestamp = $ts
              }
            )
          }
          $json = $body | ConvertTo-Json -Depth 10 -Compress
          Invoke-WebRequest `
            -Uri $env:DISCORD_WEBHOOK_URL `
            -Method POST `
            -ContentType "application/json" `
            -Body $json
