name: Deploy to Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: fabled-mystery-474200-i1

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy steamguard \
          --source ./server \
          --region us-central1 \
          --allow-unauthenticated \
          --set-secrets SECRET_KEY=SECRET_KEY:latest,ADMIN_KEY=ADMIN_KEY:latest,DISCORD_BOT_TOKEN=DISCORD_BOT_TOKEN:latest,DISCORD_GUILD_ID=DISCORD_GUILD_ID:latest,DISCORD_ROLE_ID=DISCORD_ROLE_ID:latest \
          --quiet

  build-windows-client:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Build Hardened Binary with Nuitka
        run: |
          python -m nuitka --onefile --windows-console-mode=disable --windows-uac-admin --output-filename=SteamGuard.exe steamguard.py

      # Authenticate Windows Runner to GCP for Bucket Upload
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Upload the compiled binary to your public Cloud Storage bucket
      - name: Upload Binary to GCP Storage
        shell: bash
        run: |
          gcloud storage cp ./dist/SteamGuard.exe gs://steamguard-downloads-fabled/SteamGuard.exe

      # Post a beautiful embed to your Discord channel instead of GitHub Releases
      - name: Post Embed to Discord
        shell: bash
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "embeds": [{
                   "title": "🛡️ SteamGuard Client Updated!",
                   "description": "**Terms of Service & EULA (v1.1) Acceptance Required.**\nThis tool is strictly for educational, research, and personal learning purposes. Do not distribute or share your personal license keys.",
                   "color": 2450411,
                   "fields": [
                     {
                       "name": "📝 Requirements",
                       "value": "• Be a Member of this server\n• Be subscribed to our YouTube channel\n• Must launch the application as Windows Administrator (auto-handled)",
                       "inline": false
                     },
                     {
                       "name": "📥 Download Area (Latest Build)",
                       "value": "👉 **[Click here to pass Linkvertise and Download](https://linkvertise.com/YOUR_LINK_HERE)**",
                       "inline": false
                     }
                   ],
                   "footer": {
                     "text": "SteamGuard Security • Build v'"$GITHUB_RUN_NUMBER"'"
                   }
                 }]
               }' "${{ secrets.DISCORD_WEBHOOK_URL }}"
