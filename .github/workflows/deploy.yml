name: Deploy to Cloud Run
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "steamguard.py"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: fabled-mystery-474200-i1

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy steamguard \
          --source ./server \
          --region us-central1 \
            --set-secrets SECRET_KEY=SECRET_KEY:latest,ADMIN_KEY=ADMIN_KEY:latest,DISCORD_BOT_TOKEN=DISCORD_BOT_TOKEN:latest,DISCORD_GUILD_ID=DISCORD_GUILD_ID:latest,DISCORD_ROLE_ID=DISCORD_ROLE_ID:latest,DISCORD_WEBHOOK_URL=DISCORD_WEBHOOK_URL:latest,MIN_SUPPORTED_VERSION=MIN_SUPPORTED_VERSION:latest \
            --quiet

  build-windows-client:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Build Hardened Binary with Nuitka
        run: |
          python -m nuitka --onefile --windows-console-mode=disable --windows-uac-admin --assume-yes-for-downloads --output-filename=SteamGuard.exe steamguard.py

      - name: Verify Build
        shell: pwsh
        run: |
          if (Test-Path "SteamGuard.exe") {
            Write-Host "Build successful! File size:"
            (Get-Item "SteamGuard.exe").Length / 1MB
          } else {
            throw "SteamGuard.exe not found!"
          }

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: fabled-mystery-474200-i1

      - name: Upload Binary to GCP Storage
        shell: pwsh
        run: |
          gcloud storage cp ./SteamGuard.exe gs://steamguard-downloads-fabled/SteamGuard.exe --quiet

      - name: Post Embed to Discord
        shell: pwsh
        run: |
          $json = '{"embeds":[{"title":"SteamGuard Client Updated!","description":"**Terms of Service & EULA (v1.1) Acceptance Required.**\nThis tool is strictly for educational, research, and personal learning purposes.","color":2450411,"fields":[{"name":"Requirements","value":"- Member of this server\n- Subscribed to YouTube channel\n- Run as Administrator (auto-handled)","inline":false},{"name":"Download","value":"**[Click here to Download](https://linkvertise.com/YOUR_LINK_HERE)**","inline":false}],"footer":{"text":"SteamGuard Security - Build v$env:GITHUB_RUN_NUMBER"}}]}'
          Invoke-WebRequest -Uri $env:DISCORD_WEBHOOK_URL -Method POST -ContentType "application/json" -Body $json
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
